# trigger4
name: Agent Step 5 Call Semantics
on:
  push:
    branches:
      - agent/core-correctness-phase1-step5
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-correctness-phase1-step5
          fetch-depth: 0
      - name: Apply exact CALL result model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_once(
              'mythril/laser/ethereum/state/return_data.py',
              '''    def __init__(self, return_data: List[BitVec], return_data_size: BitVec) -> None:\n        \"\"\"\n\n        :param tx_id:\n        \"\"\"\n        self.return_data = return_data\n        self.return_data_size = return_data_size\n''',
              '''    def __init__(self, return_data: List[BitVec], return_data_size: BitVec, success: bool = True) -> None:\n        self.return_data = return_data\n        self.return_data_size = return_data_size\n        self.success = success\n'''
          )
          replace_once(
              'mythril/laser/ethereum/transaction/transaction_models.py',
              '''        self.return_data = return_data\n\n        raise TransactionEndSignal(global_state, revert)\n''',
              '''        if return_data is not None:\n            return_data.success = not revert\n        self.return_data = return_data\n\n        raise TransactionEndSignal(global_state, revert)\n'''
          )
          replace_once(
              'mythril/laser/ethereum/instructions.py',
              '''global_state.current_transaction.end(\n            global_state, ReturnData(return_data, length)\n        )''',
              '''global_state.current_transaction.end(\n            global_state, ReturnData(return_data, length, success=True)\n        )'''
          )
          replace_once(
              'mythril/laser/ethereum/instructions.py',
              '''global_state.current_transaction.end(\n            global_state, return_data=ReturnData(return_data, length), revert=True\n        )''',
              '''global_state.current_transaction.end(\n            global_state, return_data=ReturnData(return_data, length, success=False), revert=True\n        )'''
          )
          p = Path('mythril/laser/ethereum/instructions.py')
          text = p.read_text()
          old = '''        if global_state.last_return_data is None:\n            # Put return value on stack\n            return_value = global_state.new_bitvec(\n                \"retval_\" + str(instr[\"address\"]), 256\n            )\n            global_state.mstate.stack.append(return_value)\n            return [global_state]\n'''
          new = '''        if global_state.last_return_data is None:\n            # No known callee result. Keep the result symbolic.\n            return_value = global_state.new_bitvec(\n                \"retval_\" + str(instr[\"address\"]), 256\n            )\n            global_state.mstate.stack.append(return_value)\n            return [global_state]\n'''
          if text.count(old) != 1:
              raise SystemExit('post_handler None branch occurrence mismatch')
          text = text.replace(old, new)
          old = '''        global_state.mstate.stack.append(return_value)\n        global_state.world_state.constraints.append(return_value == 1)\n\n        return [global_state]\n'''
          new = '''        global_state.mstate.stack.append(return_value)\n        global_state.world_state.constraints.append(\n            return_value == (1 if global_state.last_return_data.success else 0)\n        )\n\n        return [global_state]\n'''
          if text.count(old) != 1:
              raise SystemExit('post_handler success constraint occurrence mismatch')
          p.write_text(text.replace(old, new))
          PY
      - name: Add regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest
          cat > tests/laser/call_result_semantics_test.py <<'PY'
          from types import SimpleNamespace

          from mythril.laser.ethereum.instructions import Instruction
          from mythril.laser.ethereum.state.return_data import ReturnData
          from mythril.laser.smt import symbol_factory

          def test_return_data_tracks_success_status():
              ok = ReturnData([], 0, success=True)
              failed = ReturnData([], 0, success=False)
              assert ok.success is True
              assert failed.success is False

          def test_call_post_uses_revert_status_for_return_value(monkeypatch):
              state = SimpleNamespace(
                  mstate=SimpleNamespace(stack=[0, 0, 0, 0, 0, 0, 0], pc=0, mem_extend=lambda *a: None, memory={}),
                  world_state=SimpleNamespace(constraints=[]),
                  last_return_data=ReturnData([], 0, success=False),
                  get_current_instruction=lambda: {"address": 7},
                  new_bitvec=lambda name, bits: symbol_factory.BitVecSym(name, bits),
              )
              instruction = Instruction("CALL", dynamic_loader=None)
              monkeypatch.setattr(
                  'mythril.laser.ethereum.instructions.get_call_parameters',
                  lambda *args, **kwargs: (0, 0, SimpleNamespace(), 0, 0, 0, 0),
              )
              result = instruction.post_handler(state, function_name="call")
              assert "retval_7" in str(state.world_state.constraints[0])
              assert "0" in str(state.world_state.constraints[0])
              assert result == [state]
          PY
          python -m pytest -q tests/laser/call_result_semantics_test.py
          python -m pytest -q tests/laser/create_semantics_test.py tests/laser/solver_cache_test.py tests/laser/state/constraints_test.py tests/support_utils_test.py
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent_step5_call.yml
          git add mythril/laser/ethereum/state/return_data.py mythril/laser/ethereum/transaction/transaction_models.py mythril/laser/ethereum/instructions.py tests/laser/call_result_semantics_test.py .github/workflows/agent_step5_call.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix CALL return and revert result semantics'
          git push origin agent/core-correctness-phase1-step5
