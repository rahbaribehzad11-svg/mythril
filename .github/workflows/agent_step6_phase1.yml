name: Agent Step 6 Phase 1 Regression
on:
  push:
    branches:
      - agent/core-correctness-phase1-step6
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-correctness-phase1-step6
          fetch-depth: 0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Phase 1 regression suite
        run: >-
          python -m pytest -q
          tests/laser/call_result_semantics_test.py
          tests/laser/create_semantics_test.py
          tests/laser/solver_cache_test.py
          tests/laser/state/constraints_test.py
          tests/laser/transaction_test.py
          tests/support_utils_test.py
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/agent_step6_phase1.yml
          git add .github/workflows/agent_step6_phase1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'remove temporary phase 1 verification workflow'
          git push origin agent/core-correctness-phase1-step6
